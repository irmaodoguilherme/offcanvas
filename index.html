<!DOCTYPE html>
<html lang="en-US">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Accessible offcanvas panel made with pure JavaScript.">
        <link rel="shortcut icon" href="./src/favicon.svg" type="image/x-icon">
        <link rel="stylesheet" href="./src/style.css">
        <title>Accessible Offcanvas Panel</title>
    </head>

    <body>
        <main>
            <h1 class="visually-hidden">Hi, welcome to my Offcanvas</h1>
            <div aria-label="Side panel." data-js="offcanvas" role="dialog" aria-modal="true" tabindex="-1">
                <h2 class="visually-hidden">Side navigation panel</h2>
                <p>This side navigation panel was made with pure Javascript.</p>
                <button type="button" data-button="toggle-offcanvas-visibility" aria-label="Toggle side panel visibility." aria-expanded="false">
                    <img src="./src/arrow-right.svg" alt="">
                </button>
            </div>
        </main>
        <script src="app.js"></script>
    </body>

</html>
